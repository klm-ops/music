<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>三一音乐</title>
  <link rel="stylesheet" href="./styles.css?v=20260804-radio-fav-design" />
</head>
<body>
  <main class="shell" aria-label="音乐播放器">
    <section class="player-panel" aria-labelledby="appTitle">
      <nav class="tabs" aria-label="音乐来源">
        <button class="tab is-active" data-module="bluetooth" type="button" aria-current="page">蓝牙音乐</button>
        <button class="tab" data-module="radio" type="button">收音机</button>
        <button class="tab" data-module="usb" type="button">U盘音乐</button>
      </nav>

      <div class="side-actions">
        <button class="track-action-button" id="favoritePanelBtn" type="button" title="收藏列表" aria-controls="favoritePanel" aria-expanded="false">
          <img src="./assets/favorite-list.svg" width="22" height="22" alt="收藏列表" />
        </button>
        <button class="track-action-button" id="playlistPanelBtn" type="button" title="播放列表" aria-controls="playlistPanel" aria-expanded="false">
          <img src="./assets/playlist-list.svg" width="22" height="22" alt="播放列表" />
        </button>
      </div>

      <section class="feature-module usb-module module-panel" id="usbModule" aria-label="U盘音乐">
        <div class="usb-bg-overlay" id="usbBgOverlay"></div>
        <div class="hero" id="usbHero">
          <div class="album-container">
            <div class="album-wrap" id="usbDropZone">
              <img class="album-art" id="usbAlbumArt" src="./assets/black-vinyl.png" alt="专辑封面" />
            </div>
          </div>
        </div>
        <div class="visualizer-row" id="usbVisualizer">
          <canvas class="audio-visualizer" aria-hidden="true"></canvas>
        </div>
        <section class="transport module-panel" id="usbTransport" aria-label="U盘音乐播放控制">
          <div class="track-meta">
            <h2 id="usbTrackTitle"></h2>
            <p id="usbTrackMeta"></p>
          </div>
          <div class="progress-row">
            <span id="usbCurrentTime">0:00</span>
            <input id="usbProgress" class="range progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="U盘播放进度" />
            <span id="usbDuration">0:00</span>
          </div>
          <div class="controls">
            <button class="icon-button favorite-toggle" id="usbFavoriteToggleBtn" type="button" title="收藏当前曲目" aria-pressed="false">♡</button>
            <button class="icon-button usb-nav-btn" id="usbPrevBtn" type="button" title="上一首">
              <img class="usb-btn-icon" src="./assets/usb-prev.svg" alt="上一首" />
            </button>
            <button class="play-button usb-play-btn" id="usbPlayBtn" type="button" title="播放" aria-pressed="false">
              <img class="usb-play-icon" src="./assets/usb-play.svg" alt="播放" />
              <span class="usb-pause-icon" aria-hidden="true">❚❚</span>
            </button>
            <button class="icon-button usb-nav-btn" id="usbNextBtn" type="button" title="下一首">
              <img class="usb-btn-icon" src="./assets/usb-next.svg" alt="下一首" />
            </button>
            <button class="icon-button play-mode-button" id="usbPlayModeBtn" type="button" title="全部文件循环" aria-label="全部文件循环" aria-pressed="false"><span class="sequence-icon" aria-hidden="true"><i></i><i></i><i></i></span></button>
            <button class="visually-hidden" id="usbStopBtn" type="button" title="停止" tabindex="-1">Stop</button>
          </div>
          
        </section>
      </section>
      <section class="feature-module bluetooth-module module-panel" id="bluetoothModule" aria-label="蓝牙音乐">
        <div class="bluetooth-stage" role="group" aria-label="蓝牙音乐控制台">
          <div class="bluetooth-offline" id="btOfflinePanel">
            <img src="./assets/bluetooth/bt-offline.png" alt="蓝牙未连接" />
            <p>蓝牙音频尚未连接</p>
            <button class="bluetooth-open-button" id="btScanBtn" type="button">搜索蓝牙</button>
          </div>
          <div class="bluetooth-player" id="btPlayerPanel">
            <div class="bluetooth-album">
              <img src="./assets/bluetooth/bt-album.png" alt="蓝牙音乐封面" />
            </div>
            <h2 id="btNowPlaying">Bluetooth device not connected</h2>
            <p id="btDeviceMeta">Connect a device to use playback controls</p>
            <div class="bluetooth-track-meta"><span id="btArtist">Bluetooth Audio</span><span id="btAlbum">External Device</span></div>
            <div class="visualizer-row" id="btVisualizer">
              <canvas class="audio-visualizer" aria-hidden="true"></canvas>
            </div>
            <div class="bluetooth-progress">
              <span id="btElapsed">0:00</span>
              <div class="bluetooth-progress-track" id="btProgressTrack" role="slider" aria-label="蓝牙播放进度" aria-valuemin="0" aria-valuemax="232" aria-valuenow="0" tabindex="0"><i id="btProgressNeedle"></i></div>
              <span id="btDuration">--:--</span>
            </div>
            <div class="feature-controls bluetooth-controls">
              <button class="icon-button" id="btPrevBtn" type="button" aria-label="上一首">Prev</button>
              <button class="play-button small-play" id="btPlayBtn" type="button" aria-label="播放或暂停">
                <span class="play-icon" aria-hidden="true">▶</span>
                <span class="pause-icon" aria-hidden="true">❚❚</span>
              </button>
              <button class="icon-button" id="btNextBtn" type="button" aria-label="下一首">Next</button>
            </div>
            <div class="bluetooth-mode-row">
              <button class="bluetooth-mode-button" id="btPlayModeBtn" type="button">全部文件循环</button>
              <button class="bluetooth-mode-button" id="btDisconnectBtn" type="button">断开连接</button>
            </div>
            <div class="module-volume bluetooth-volume">
              <input id="btVolume" class="range" type="range" min="0" max="1" value="0.7" step="0.01" aria-label="蓝牙音量" />
              <strong id="btVolumeValue">70%</strong>
            </div>
          </div>
          <p class="module-status bluetooth-status" id="btStatus" hidden></p>
          <div class="bluetooth-device-panel" hidden>
            <div class="bluetooth-device-head"><span>可用设备</span><button class="bluetooth-refresh-button" id="btRefreshBtn" type="button">搜索设备</button></div>
            <ol class="device-list" id="btDeviceList" aria-live="polite"></ol>
          </div>
        </div>
      </section>

      <section class="feature-module radio-module module-panel" id="radioModule" aria-label="收音机">
        <div class="radio-stage" role="group" aria-label="收音机控制台">
          <div class="radio-mode-row">
            <div class="radio-band-switch" role="group" aria-label="收音机模式"><button class="is-active" id="radioFmBtn" type="button">FM</button><button id="radioAmBtn" type="button">AM</button></div>
          </div>
          <div class="radio-frequency-display"><span id="radioStereo" class="stereo-icon" aria-hidden="true">ST</span><span id="radioFrequency">87.0</span><small id="radioUnit">MHz</small></div>
          <div class="frequency-rail" aria-hidden="true"><span id="radioFreqMin">87</span><div class="frequency-track"><div class="frequency-ruler" id="radioRuler"></div><i id="radioNeedle"></i></div><span id="radioFreqMax">108</span></div>
          <div class="radio-controls-row">
            <button class="icon-button" id="radioFavoriteBtn" type="button" title="收藏当前电台" aria-pressed="false">
              <svg class="favorite-icon" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="radio-controls-group">
              <button class="icon-button" id="radioPrevStationBtn" type="button" title="上一台">
                <img src="assets/radio/prev-station.png" alt="上一台" width="48" height="48"/>
              </button>
              <button class="icon-button" id="radioTuneDownBtn" type="button" title="微调频左">
                <img src="assets/radio/tune-down.png" alt="微调频左" width="48" height="48"/>
              </button>
              <button class="play-button" id="radioPlayBtn" type="button" title="播放/暂停">
                <svg class="play-icon" viewBox="0 0 70 70" width="56" height="56" aria-hidden="true">
                  <circle cx="35" cy="35" r="35" fill="#2181FF"/>
                  <path d="M28 20.571V48.8813C28 49.9173 29.1398 50.5496 30.0195 50.0001L46.5 35L30.0195 19.9999C29.1398 19.4524 28 20.0848 28 21.1208Z" fill="white"/>
                </svg>
                <svg class="pause-icon" viewBox="0 0 70 70" width="56" height="56" aria-hidden="true">
                  <circle cx="35" cy="35" r="35" fill="#2181FF"/>
                  <rect x="26" y="20" width="7" height="30" rx="2" fill="white"/>
                  <rect x="37" y="20" width="7" height="30" rx="2" fill="white"/>
                </svg>
              </button>
              <button class="icon-button" id="radioTuneUpBtn" type="button" title="微调频右">
                <img src="assets/radio/tune-up.png" alt="微调频右" width="48" height="48"/>
              </button>
              <button class="icon-button" id="radioNextStationBtn" type="button" title="下一台">
                <img src="assets/radio/next-station.png" alt="下一台" width="48" height="48"/>
              </button>
            </div>
            <button class="icon-button" id="radioScanBtn" type="button" title="搜台">
              <img src="assets/radio/scan.png" alt="搜台" width="48" height="48"/>
            </button>
          </div>
          <div class="radio-list-container">
            <div class="radio-list-head"><h3>我的收藏</h3></div>
            <div class="preset-grid" id="presetGrid" aria-live="polite"></div>
          </div>
          <input id="radioVolume" class="range" type="range" min="0" max="1" value="0.6" step="0.01" aria-label="收音机音量" hidden /><strong id="radioVolumeValue" hidden>60%</strong>
        </div>
        <div class="radio-search-modal" id="radioSearchModal" hidden>
          <div class="radio-search-overlay"></div>
          <div class="radio-search-dialog" role="dialog" aria-modal="true" aria-label="电台搜索中">
            <img class="radio-search-spinner" src="https://lanhu-oss-2537-2.lanhuapp.com/FigmaDDSSlicePNG929c876a50e83ec9208efd84152ed7b0.png" alt="" />
            <span class="radio-search-text">电台搜索中</span>
          </div>
        </div>
      </section>

    </section>

    <aside class="drawer-panel favorite-panel" id="favoritePanel" aria-labelledby="favoriteTitle" aria-hidden="true">
      <div class="sheet-handle" data-drag-handle="favorite" role="slider" aria-label="拖动收起面板" tabindex="0">
        <span class="sheet-handle-bar" aria-hidden="true"></span>
      </div>
      <div class="playlist-head sheet-head">
        <div class="sheet-head-left">
          <div class="sheet-batch-bar" id="favoriteBatchBar" hidden>
            <button class="track-select-checkbox batch-select-all" id="favoriteSelectAllBtn" type="button" aria-label="全选"></button>
            <span class="batch-select-label" id="favoriteSelectLabel">全选</span>
          </div>
          <div class="sheet-normal-controls">
            <button class="sheet-play-btn" id="favoritePlayBtn" type="button" title="播放/暂停" aria-pressed="false">
              <img class="sheet-icon-play" src="./assets/playlist-icons/play.svg" alt="播放" />
              <img class="sheet-icon-pause" src="./assets/playlist-icons/pause.svg" alt="暂停" />
            </button>
            <h2 id="favoriteTitle">收藏列表 <span id="favoriteCount">(0)</span></h2>
            <div class="sheet-mode-wrapper">
              <button class="sheet-mode-btn" id="favoritePlayModeBtn" type="button" title="顺序播放" aria-label="顺序播放">
                <span class="sheet-mode-icon" aria-hidden="true"></span>
              </button>
              <span class="sheet-mode-label" id="favoriteModeLabel">全部文件循环</span>
            </div>
          </div>
        </div>
        <div class="sheet-head-right">
          <button class="sheet-edit-btn" id="favoriteEditBtn" type="button" title="编辑" aria-label="编辑">
            <img class="sheet-icon-edit" src="./assets/playlist-icons/edit.svg" alt="编辑" />
          </button>
          <div class="sheet-batch-actions" id="favoriteBatchActions" hidden>
            <button class="batch-remove-btn" id="favoriteBatchDeleteBtn" type="button" title="移除" aria-label="移除" disabled>移除</button>
            <button class="batch-cancel-btn" id="favoriteCancelBtn" type="button" title="取消" aria-label="取消">取消</button>
          </div>
        </div>
      </div>
      <ol class="playlist" id="favoriteList" aria-live="polite"></ol>
    </aside>

    <aside class="drawer-panel playlist-panel" id="playlistPanel" aria-labelledby="playlistTitle" aria-hidden="true">
      <div class="sheet-handle" data-drag-handle="playlist" role="slider" aria-label="拖动收起面板" tabindex="0">
        <span class="sheet-handle-bar" aria-hidden="true"></span>
      </div>
      <div class="playlist-head sheet-head">
        <div class="sheet-head-left">
          <div class="sheet-batch-bar" id="playlistBatchBar" hidden>
            <button class="track-select-checkbox batch-select-all" id="playlistSelectAllBtn" type="button" aria-label="全选"></button>
            <span class="batch-select-label" id="playlistSelectLabel">全选</span>
          </div>
          <div class="sheet-normal-controls">
            <button class="sheet-play-btn" id="playlistPlayBtn" type="button" title="播放/暂停" aria-pressed="false">
              <img class="sheet-icon-play" src="./assets/playlist-icons/play.svg" alt="播放" />
              <img class="sheet-icon-pause" src="./assets/playlist-icons/pause.svg" alt="暂停" />
            </button>
            <h2 id="playlistTitle">音乐列表 <span id="trackCount">(0)</span></h2>
            <div class="sheet-mode-wrapper">
              <button class="sheet-mode-btn" id="playlistPlayModeBtn" type="button" title="顺序播放" aria-label="顺序播放">
                <span class="sheet-mode-icon" aria-hidden="true"></span>
              </button>
              <span class="sheet-mode-label" id="playlistModeLabel">全部文件循环</span>
            </div>
          </div>
        </div>
        <div class="sheet-head-right">
          <button class="sheet-edit-btn" id="playlistEditBtn" type="button" title="编辑" aria-label="编辑">
            <img class="sheet-icon-edit" src="./assets/playlist-icons/edit.svg" alt="编辑" />
          </button>
          <div class="sheet-batch-actions" id="playlistBatchActions" hidden>
            <button class="batch-remove-btn" id="playlistBatchDeleteBtn" type="button" title="移除" aria-label="移除" disabled>移除</button>
            <button class="batch-cancel-btn" id="playlistCancelBtn" type="button" title="取消" aria-label="取消">取消</button>
          </div>
        </div>
      </div>
      <ol class="playlist" id="playlist" aria-live="polite"></ol>
    </aside>

    <div class="usb-toast" id="usbToast" role="status" aria-live="polite"></div>
    <button class="drawer-backdrop" id="drawerBackdrop" type="button" aria-label="关闭面板"></button>
    <div class="confirm-dialog" id="confirmDialog" hidden>
      <div class="confirm-backdrop"></div>
      <div class="confirm-box" role="dialog" aria-modal="true">
        <p id="confirmMessage" class="confirm-message">确定要移除1首歌吗？</p>
        <div class="confirm-actions">
          <button class="confirm-btn-cancel" id="confirmCancelBtn" type="button">取消</button>
          <button class="confirm-btn-ok" id="confirmOkBtn" type="button">确定</button>
        </div>
      </div>
    </div>
  </main>
  <audio id="audio">
  <script src="./app.js?v=20260727-remove-local"></script>
</body>
</html>
